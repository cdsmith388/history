<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c0e1a">
<title>Volume Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #0c0e1a; min-height: 100vh; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
#root { min-height: 100vh; }
.pre-load { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #f4b83a; font-family: 'Press Start 2P', 'Courier New', monospace; font-size: 14px; letter-spacing: 2px; }
.pre-load .sub { color: #5dd3a8; font-size: 11px; animation: blink 1.2s infinite; }
.err { color: #e85d75; font-family: 'VT323', monospace; font-size: 16px; padding: 20px; max-width: 600px; word-break: break-word; white-space: pre-wrap; line-height: 1.5; }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0.2; } }
</style>
</head>
<body>
<div id="root"><div class="pre-load"><div>VOLUME QUEST</div><div class="sub">LOADING...</div></div></div>
<script>
window.addEventListener("error", function(e) {
  var root = document.getElementById("root");
  if (root) root.innerHTML = '<div class="err">ERROR: ' + (e.message || "unknown") + (e.error && e.error.stack ? "\n\n" + e.error.stack : "") + '</div>';
});
</script>
